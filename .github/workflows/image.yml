name: image

# main     -> ghcr.io/<owner>/airplanemode-doom:main
# tag v1.2.3 -> ghcr.io/<owner>/airplanemode-doom:1.2.3 (what the platform repo pins)
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Map tools and maps (every map validated)
        run: |
          pip install -r wad/requirements.txt
          python wad/test_wad.py

      - name: Page checks
        run: python tools/test_web.py

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/airplanemode-doom
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}

      # The engine and WAD stages run once on the runner ($BUILDPLATFORM); only the small
      # busybox stage is built per architecture.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
